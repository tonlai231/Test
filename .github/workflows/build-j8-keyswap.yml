name: Build J8 KeySwap APK

on:
  push:
    branches: ["chatgpt-j8-keyswap"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk J8-KeySwap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: J8-KeySwap-APK
          path: J8-KeySwap.apk
          if-no-files-found: error
